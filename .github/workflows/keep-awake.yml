name: Keep awake

# Free Supabase projects pause after about a week without database activity. The site's
# health check runs one tiny query, so calling it twice a week keeps the project awake
# (and tells us here if the site or the database is down).

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the health check
        run: |
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 30 https://clavisstudio.vercel.app/api/health) && echo "$body" && echo "$body" | grep -q '"database":"up"' && exit 0
            echo "attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
